# Fast type-check of the SwiftUI frontend against the iOS 16.0 deployment target.
# It does not build the emulator core, so it returns in minutes instead of an hour and
# reports every "only available in iOS 17/18/26" use in one pass.
name: iOS 16 Swift check

on:
  push:
    branches:
      - ios16-compat
    paths:
      - 'platforms/ios/app/src/main/swift/**'
      - 'platforms/ios/app/src/main/cpp/**'
      - '.github/workflows/ios16-swift-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Type-check Swift for iOS 16.0
        working-directory: platforms/ios/app/src/main
        run: |
          set -o pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          swiftc -typecheck \
            -swift-version 6 \
            -wmo \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK" \
            -import-objc-header cpp/ARMSX2-Bridging-Header.h \
            -I cpp \
            -module-name ARMSX2iOS \
            $(find swift -name '*.swift' | sort) > "$RUNNER_TEMP/swift-check.log" 2>&1

      # The runner's log is not reachable from every tool, so also publish it to the
      # ci-logs branch where it can be read with a plain git fetch.
      - name: Publish log to ci-logs branch
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs"
          git init -q && git checkout -q -b ci-logs
          cp "$RUNNER_TEMP/swift-check.log" swift-check.log
          grep -E "error:" swift-check.log | sed -E 's#^.*/swift/##' | sort | uniq > swift-errors.txt || true
          echo "${GITHUB_SHA}" > commit.txt
          git add -A && git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "swift-check log for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs:ci-logs-swift
