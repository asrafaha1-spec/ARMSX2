# iOS-only IPA build for the iOS 16 compatibility work. The full "Build All Platforms"
# workflow also builds every desktop and Android target; this one only builds the
# unsigned iOS device IPA, so a Swift or CMake mistake shows up without the other jobs.
name: Build iOS IPA (iOS 16+)

on:
  push:
    branches:
      - ios16-compat
    paths:
      - 'platforms/ios/**'
      - 'pcsx2/**'
      - 'common/**'
      - '3rdparty/**'
      - '.github/workflows/ios16.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS (arm64, unsigned device IPA, deployment target 16.0)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          xcrun --sdk iphoneos --show-sdk-version

      # The iOS 26 SDK is still required: the Liquid Glass code paths are compiled in
      # and only reached behind runtime availability checks.
      - name: Check SDK
        run: |
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          [[ "${sdk_version%%.*}" -ge 26 ]] || { echo "::error::Need the iOS 26 SDK, found ${sdk_version}"; exit 1; }

      - name: Install Rust iOS target
        run: rustup target add aarch64-apple-ios

      - name: Configure (CMake, Xcode generator, device SDK, no signing)
        working-directory: platforms/ios/app/src/main/cpp
        run: >
          cmake -G Xcode -B build
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DARMSX2_REAL_DEVICE=ON
          -DARMSX2_IOS_DEPLOYMENT_TARGET=16.0

      - name: Build
        working-directory: platforms/ios/app/src/main/cpp
        run: >
          set -o pipefail;
          cmake --build build --config Release
          -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Publish log to ci-logs branch
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs"
          git init -q && git checkout -q -b ci-logs
          grep -E "error:|warning: .*(only available|deployment target|built for newer)|BUILD (FAILED|SUCCEEDED)|\*\* BUILD" "$RUNNER_TEMP/build.log" | sort | uniq | head -400 > build-errors.txt || true
          tail -n 400 "$RUNNER_TEMP/build.log" > build-tail.log || true
          echo "${GITHUB_SHA}" > commit.txt
          git add -A && git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "build log for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs:ci-logs-build

      - name: Check the deployment target of the built app
        working-directory: platforms/ios/app/src/main/cpp
        run: |
          APP_PATH=$(find build -name "ARMSX2iOS.app" -type d | head -1)
          [ -n "$APP_PATH" ] || { echo "::error::ARMSX2iOS.app not found"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_PATH/Info.plist"
          vtool -show-build "$APP_PATH/ARMSX2iOS" | grep -E "minos|platform"

      - name: Package unsigned .ipa
        working-directory: platforms/ios/app/src/main/cpp
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          IPA_NAME="ARMSX2-iOS16-${SHORT_SHA}.ipa"
          APP_PATH=$(find build -name "ARMSX2iOS.app" -type d | head -1)
          STAGING=$(mktemp -d)
          mkdir -p "$STAGING/Payload"
          cp -R "$APP_PATH" "$STAGING/Payload/"
          (cd "$STAGING" && zip -qr "$GITHUB_WORKSPACE/$IPA_NAME" Payload -x "*.DS_Store")
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          ls -lh "$GITHUB_WORKSPACE/$IPA_NAME"

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ github.workspace }}/${{ env.IPA_NAME }}
          if-no-files-found: error
